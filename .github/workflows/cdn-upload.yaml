name: CDN Upload Static Assets

on:
  workflow_call:
    inputs:
      dist_dir:
        description: "Directory containing pre-built static assets to upload"
        required: true
        type: string
      artifact_name:
        description: "Artifact name to download before uploading (optional)"
        required: false
        type: string
        default: ""
      destination_prefix:
        description: "Blob prefix path inside the container (the content hash from cdn-build-assets)"
        required: true
        type: string
      commit_sha:
        description: "Full commit SHA the assets were built from. When set, writes a .by-commit/<sha> lookup blob containing destination_prefix so release jobs can resolve the content ref without rebuilding. Only pass this on latest-channel uploads."
        required: false
        type: string
        default: ""
      asset_extensions:
        # Keep this identical to the cdn-build-assets filter: the content hash covers exactly this set — a file hashed but not uploaded (or vice versa) breaks the ref↔bytes correspondence.
        # Callers should pass cdn-build-assets's asset_extensions output rather than overriding this.
        description: "Comma-separated list of file extensions to upload. Unioned with asset_dirs and asset_files; may be empty when they cover the set."
        required: false
        type: string
        default: "css,js,map,jpg,jpeg,png,webp,gif,svg,ico,mp4,webm,mp3,ogg,woff,woff2,ttf,otf,eot"
      asset_dirs:
        # Keep this identical to the cdn-build-assets filter: the content hash covers exactly this union — a file hashed but not uploaded (or vice versa) breaks the ref↔bytes correspondence.
        # Callers should pass cdn-build-assets's asset_dirs output rather than overriding this.
        description: "Comma-separated list of dist_dir subdirectories uploaded wholesale — every file under them regardless of type"
        required: false
        type: string
        default: ""
      asset_files:
        # Keep this identical to the cdn-build-assets filter: the content hash covers exactly this union — a file hashed but not uploaded (or vice versa) breaks the ref↔bytes correspondence.
        # Callers should pass cdn-build-assets's asset_files output rather than overriding this.
        description: "Comma-separated list of individual files uploaded by dist-relative path (e.g. 'favicon.ico')"
        required: false
        type: string
        default: ""
      cdn_account_name:
        description: "Azure Storage account name"
        required: true
        type: string
      cdn_container:
        description: "Azure Blob container name. Defaults to repo_name (one container per repo)."
        required: false
        type: string
        default: ""
      repo_name:
        description: "Repository / application name; used as the container name when cdn_container is empty."
        required: false
        type: string
        default: ""
      cache_control:
        description: "Cache-Control header for uploaded blobs"
        required: false
        type: string
        default: "public, max-age=31536000, immutable"
      auth_mode:
        description: "Blob auth mode: 'sas' uses CDN_SAS_TOKEN; 'oidc' uses azure/login with the AZURE_* secrets and --auth-mode login."
        required: false
        type: string
        default: "sas"
      environment:
        description: "GitHub Environment the upload job runs under; the Azure federated credential subject is repo:...:environment:<this value>. Empty means no environment (legacy SAS callers)."
        required: false
        type: string
        default: ""
    secrets:
      CDN_SAS_TOKEN:
        description: "Azure Blob Storage SAS token (required when auth_mode is 'sas')"
        required: false
      AZURE_CLIENT_ID:
        description: "Client ID of the managed identity (required when auth_mode is 'oidc')"
        required: false
      AZURE_TENANT_ID:
        description: "Entra ID tenant ID (required when auth_mode is 'oidc')"
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: "Azure subscription ID (required when auth_mode is 'oidc')"
        required: false

jobs:
  upload:
    runs-on: ubuntu-latest
    # Caller jobs may not set environment themselves, so it arrives as an input and is applied here.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.dist_dir }}

      - name: Azure login (OIDC)
        if: inputs.auth_mode == 'oidc'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Upload assets to Azure Blob Storage
        uses: azure/cli@v3
        env:
          SAS_TOKEN: ${{ secrets.CDN_SAS_TOKEN }}
          AUTH_MODE: ${{ inputs.auth_mode }}
          CDN_ACCOUNT_NAME: ${{ inputs.cdn_account_name }}
          CDN_CONTAINER: ${{ inputs.cdn_container || inputs.repo_name }}
          ASSET_EXTS: ${{ inputs.asset_extensions }}
          ASSET_DIRS: ${{ inputs.asset_dirs }}
          ASSET_FILES: ${{ inputs.asset_files }}
          PREFIX: ${{ inputs.destination_prefix }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CACHE_CONTROL: ${{ inputs.cache_control }}
          DIST_DIR: ${{ inputs.dist_dir }}
        with:
          inlineScript: |
            set -euo pipefail

            AUTH_ARGS=()
            case "${AUTH_MODE}" in
              oidc)
                AUTH_ARGS+=(--auth-mode login)
                ;;
              sas)
                if [ -z "${SAS_TOKEN:-}" ]; then
                  echo "::error::auth_mode=sas requires the CDN_SAS_TOKEN secret" >&2
                  exit 1
                fi
                AUTH_ARGS+=(--sas-token "${SAS_TOKEN}")
                ;;
              *)
                echo "::error::unknown auth_mode '${AUTH_MODE}' (expected 'sas' or 'oidc')" >&2
                exit 1
                ;;
            esac

            # Never green-skip an upload job: missing config is a caller bug, and downstream deployments gate on this job having published assets.
            if [ -z "${CDN_ACCOUNT_NAME:-}" ] || [ -z "${CDN_CONTAINER:-}" ]; then
              echo "::error::CDN upload requires cdn_account_name and cdn_container (or repo_name)" >&2
              exit 1
            fi

            SRC_DIR="${DIST_DIR}"
            if [ ! -d "${SRC_DIR}" ]; then
              echo "::error::No dist dir ${SRC_DIR}; nothing to upload." >&2
              exit 1
            fi

            echo "Uploading assets from ${SRC_DIR} to container ${CDN_CONTAINER} at prefix ${PREFIX}"
            echo "Using asset extensions: ${ASSET_EXTS}"
            echo "Using asset dirs: ${ASSET_DIRS:-<none>}"
            echo "Using asset files: ${ASSET_FILES:-<none>}"

            # Resolve directory and file selectors once — the validated set is
            # reused for the empty-match guard and the upload below. Entries are
            # normalized (strip leading ./ and trailing /, collapse /./ and //)
            # so selector spelling can't produce a blob name no URL will fetch.
            VALID_DIRS=()
            VALID_FILES=()
            # path_re via var: a space in the class word-splits on the =~ RHS
            path_re='[^a-zA-Z0-9/_.% -]'
            OLD_IFS="$IFS"
            IFS=','
            for d in ${ASSET_DIRS}; do
              d_trim="$(printf '%s' "$d" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; s|^\.\?/||; s|/\./|/|g; s|/\+|/|g; s|/$||')"
              [ -z "${d_trim}" ] && continue
              if [[ "${d_trim}" =~ ${path_re} ]] || [[ "${d_trim}" =~ (^|/)\.\.(/|$) ]]; then
                echo "::error::asset_dirs entry '${d_trim}' is not a safe relative path" >&2
                exit 1
              fi
              if [ ! -d "${SRC_DIR}/${d_trim}" ]; then
                echo "::error::asset_dirs entry '${d_trim}' does not exist under ${SRC_DIR}" >&2
                exit 1
              fi
              if [ -L "${SRC_DIR}/${d_trim}" ] || find "${SRC_DIR}/${d_trim}" -type l -print -quit | grep -q .; then
                echo "::error::asset_dirs entry '${d_trim}' is or contains symlinks — uploads would follow them outside dist/" >&2
                exit 1
              fi
              VALID_DIRS+=("${d_trim}")
            done
            for f in ${ASSET_FILES}; do
              f_trim="$(printf '%s' "$f" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; s|^\.\?/||; s|/\./|/|g; s|/\+|/|g; s|/$||')"
              [ -z "${f_trim}" ] && continue
              if [[ "${f_trim}" =~ ${path_re} ]] || [[ "${f_trim}" =~ (^|/)\.\.(/|$) ]]; then
                echo "::error::asset_files entry '${f_trim}' is not a safe relative path" >&2
                exit 1
              fi
              if [ ! -f "${SRC_DIR}/${f_trim}" ]; then
                echo "::error::asset_files entry '${f_trim}' not found under ${SRC_DIR}" >&2
                exit 1
              fi
              if [ -L "${SRC_DIR}/${f_trim}" ]; then
                echo "::error::asset_files entry '${f_trim}' is a symlink — uploads would follow it outside dist/" >&2
                exit 1
              fi
              VALID_FILES+=("${f_trim}")
            done
            IFS="${OLD_IFS}"

            # Guard: an empty local match means .by-commit would point at a prefix this run never published (or at stale blobs from an earlier run).
            match_count=0
            OLD_IFS="$IFS"
            IFS=','
            for ext in ${ASSET_EXTS}; do
              ext_trim="$(printf '%s' "$ext" | xargs)"
              [ -z "${ext_trim}" ] && continue
              n=$(find "${SRC_DIR}" -type f -name "*.${ext_trim}" | wc -l)
              match_count=$((match_count + n))
            done
            IFS="${OLD_IFS}"
            for d in "${VALID_DIRS[@]}"; do
              n=$(find "${SRC_DIR}/${d}" -type f | wc -l)
              match_count=$((match_count + n))
            done
            match_count=$((match_count + ${#VALID_FILES[@]}))
            if [ "${match_count}" -eq 0 ]; then
              echo "::error::Upload matched no local files in ${SRC_DIR} — check asset_dirs/asset_files/asset_extensions and the dist artifact contents."
              exit 1
            fi
            echo "Matched ${match_count} local files."

            # Extension matches: with dir/file selectors in play, subtract
            # already-covered paths and upload the remainder per file — no blob
            # is uploaded twice (the hash side dedupes via sort -u). Extension-
            # only callers keep the efficient per-extension batch upload.
            if [ "${#VALID_DIRS[@]}" -eq 0 ] && [ "${#VALID_FILES[@]}" -eq 0 ]; then
              OLD_IFS="$IFS"
              IFS=','
              for ext in ${ASSET_EXTS}; do
                ext_trim="$(printf '%s' "$ext" | xargs)"
                [ -z "${ext_trim}" ] && continue
                pattern="*.${ext_trim}"
                echo "  - Uploading assets matching pattern: ${pattern}"
                az storage blob upload-batch \
                  --account-name "${CDN_ACCOUNT_NAME}" \
                  "${AUTH_ARGS[@]}" \
                  --destination "${CDN_CONTAINER}" \
                  --destination-path "${PREFIX}" \
                  --source "${SRC_DIR}" \
                  --pattern "${pattern}" \
                  --overwrite true \
                  --content-cache-control "${CACHE_CONTROL}"
              done
              IFS="${OLD_IFS}"
            else
              mapfile -t ext_files < <(
                IFS=','
                for ext in ${ASSET_EXTS}; do
                  ext_trim="$(printf '%s' "$ext" | xargs)"
                  [ -z "${ext_trim}" ] && continue
                  find "${SRC_DIR}" -type f -name "*.${ext_trim}"
                done
              )
              for ef in ${ext_files[@]+"${ext_files[@]}"}; do
                rel="${ef#"${SRC_DIR}/"}"
                covered=0
                for d in "${VALID_DIRS[@]}"; do
                  case "${rel}" in "${d}/"*) covered=1;; esac
                done
                for f in "${VALID_FILES[@]}"; do
                  [ "${rel}" = "${f}" ] && covered=1
                done
                [ "${covered}" -eq 1 ] && continue
                echo "  - Uploading extension match: ${rel}"
                az storage blob upload \
                  --account-name "${CDN_ACCOUNT_NAME}" \
                  "${AUTH_ARGS[@]}" \
                  --container-name "${CDN_CONTAINER}" \
                  --name "${PREFIX}/${rel}" \
                  --file "${ef}" \
                  --overwrite true \
                  --content-cache-control "${CACHE_CONTROL}"
              done
            fi

            # Whole-directory uploads: the dir segment goes in
            # destination-path — --source on a subdir uploads its contents
            # relative to itself, so omitting it would flatten the tree.
            for d in ${VALID_DIRS[@]+"${VALID_DIRS[@]}"}; do
              echo "  - Uploading directory: ${d}/"
              az storage blob upload-batch \
                --account-name "${CDN_ACCOUNT_NAME}" \
                "${AUTH_ARGS[@]}" \
                --destination "${CDN_CONTAINER}" \
                --destination-path "${PREFIX}/${d}" \
                --source "${SRC_DIR}/${d}" \
                --overwrite true \
                --content-cache-control "${CACHE_CONTROL}"
            done

            # Explicit single-file uploads (e.g. favicon.ico at the root).
            # Skip files already covered by a selected directory.
            for f in ${VALID_FILES[@]+"${VALID_FILES[@]}"}; do
              in_dir=0
              for d in "${VALID_DIRS[@]}"; do
                case "${f}" in "${d}/"*) in_dir=1;; esac
              done
              [ "${in_dir}" -eq 1 ] && { echo "  - Skipping ${f} (inside a selected directory)"; continue; }
              echo "  - Uploading file: ${f}"
              az storage blob upload \
                --account-name "${CDN_ACCOUNT_NAME}" \
                "${AUTH_ARGS[@]}" \
                --container-name "${CDN_CONTAINER}" \
                --name "${PREFIX}/${f}" \
                --file "${SRC_DIR}/${f}" \
                --overwrite true \
                --content-cache-control "${CACHE_CONTROL}"
            done
            echo "CDN upload complete."

            # Commit→content-ref lookup: release jobs read .by-commit/<sha> to find which prefix to promote without rebuilding.
            # The leading dot keeps it out of the lifecycle expiry rules and cdn-cleanup's prefix scan.
            if [ -n "${COMMIT_SHA:-}" ]; then
              LOOKUP_FILE="$(mktemp)"
              printf '%s\n' "${PREFIX}" > "${LOOKUP_FILE}"
              az storage blob upload \
                --account-name "${CDN_ACCOUNT_NAME}" \
                "${AUTH_ARGS[@]}" \
                --container-name "${CDN_CONTAINER}" \
                --name ".by-commit/${COMMIT_SHA}" \
                --file "${LOOKUP_FILE}" \
                --overwrite true
              rm -f "${LOOKUP_FILE}"
              echo "Wrote lookup blob .by-commit/${COMMIT_SHA} -> ${PREFIX}"
            fi
