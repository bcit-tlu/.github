name: CDN Upload Static Assets

on:
  workflow_call:
    inputs:
      dist_dir:
        description: "Directory containing pre-built static assets to upload"
        required: true
        type: string
      artifact_name:
        description: "Artifact name to download before uploading (optional)"
        required: false
        type: string
        default: ""
      destination_prefix:
        description: "Blob prefix path inside the container"
        required: true
        type: string
      asset_extensions:
        description: "Comma-separated list of file extensions to upload"
        required: false
        type: string
        default: "jpg,jpeg,png,webp,gif,svg,ico,mp4,webm,mp3,ogg,woff,woff2,ttf,otf,css,js,map"
      cdn_account_name:
        description: "Azure Storage account name"
        required: true
        type: string
      cdn_container:
        description: "Azure Blob container name. Defaults to repo_name (one container per repo)."
        required: false
        type: string
        default: ""
      repo_name:
        description: "Repository / application name; used as the container name when cdn_container is empty."
        required: false
        type: string
        default: ""
      cache_control:
        description: "Cache-Control header for uploaded blobs"
        required: false
        type: string
        default: "public, max-age=31536000, immutable"
      auth_mode:
        description: "Blob auth mode: 'sas' uses CDN_SAS_TOKEN; 'oidc' uses azure/login with the AZURE_* secrets and --auth-mode login."
        required: false
        type: string
        default: "sas"
      environment:
        description: "GitHub Environment the upload job runs under; the Azure federated credential subject is repo:...:environment:<this value>. Empty means no environment (legacy SAS callers)."
        required: false
        type: string
        default: ""
    secrets:
      CDN_SAS_TOKEN:
        description: "Azure Blob Storage SAS token (required when auth_mode is 'sas')"
        required: false
      AZURE_CLIENT_ID:
        description: "Client ID of the managed identity (required when auth_mode is 'oidc')"
        required: false
      AZURE_TENANT_ID:
        description: "Entra ID tenant ID (required when auth_mode is 'oidc')"
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: "Azure subscription ID (required when auth_mode is 'oidc')"
        required: false

jobs:
  upload:
    runs-on: ubuntu-latest
    # Caller jobs may not set environment themselves, so it arrives as an input and is applied here.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.dist_dir }}

      - name: Azure login (OIDC)
        if: inputs.auth_mode == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload assets to Azure Blob Storage
        uses: azure/cli@v3
        env:
          SAS_TOKEN: ${{ secrets.CDN_SAS_TOKEN }}
          AUTH_MODE: ${{ inputs.auth_mode }}
          CDN_ACCOUNT_NAME: ${{ inputs.cdn_account_name }}
          CDN_CONTAINER: ${{ inputs.cdn_container || inputs.repo_name }}
          ASSET_EXTS: ${{ inputs.asset_extensions }}
          PREFIX: ${{ inputs.destination_prefix }}
          CACHE_CONTROL: ${{ inputs.cache_control }}
          DIST_DIR: ${{ inputs.dist_dir }}
        with:
          inlineScript: |
            set -euo pipefail

            AUTH_ARGS=()
            if [ "${AUTH_MODE}" = "oidc" ]; then
              AUTH_ARGS+=(--auth-mode login)
            elif [ -n "${SAS_TOKEN:-}" ]; then
              AUTH_ARGS+=(--sas-token "${SAS_TOKEN}")
            else
              echo "::warning::CDN upload config incomplete (missing SAS_TOKEN/AZURE_* or CDN_ACCOUNT_NAME/CDN_CONTAINER); skipping upload."
              exit 0
            fi

            if [ -z "${CDN_ACCOUNT_NAME:-}" ] || [ -z "${CDN_CONTAINER:-}" ]; then
              echo "::warning::CDN upload config incomplete (missing CDN_ACCOUNT_NAME/CDN_CONTAINER); skipping upload."
              exit 0
            fi

            SRC_DIR="${DIST_DIR}"
            if [ ! -d "${SRC_DIR}" ]; then
              echo "::error::No dist dir ${SRC_DIR}; nothing to upload." >&2
              exit 1
            fi

            echo "Uploading assets from ${SRC_DIR} to container ${CDN_CONTAINER} at prefix ${PREFIX}"
            echo "Using asset extensions: ${ASSET_EXTS}"

            OLD_IFS="$IFS"
            IFS=','
            for ext in ${ASSET_EXTS}; do
              ext_trim="$(printf '%s' "$ext" | xargs)"
              [ -z "${ext_trim}" ] && continue
              pattern="*.${ext_trim}"
              echo "  - Uploading assets matching pattern: ${pattern}"
              az storage blob upload-batch \
                --account-name "${CDN_ACCOUNT_NAME}" \
                "${AUTH_ARGS[@]}" \
                --destination "${CDN_CONTAINER}" \
                --destination-path "${PREFIX}" \
                --source "${SRC_DIR}" \
                --pattern "${pattern}" \
                --overwrite true \
                --content-cache-control "${CACHE_CONTROL}"
            done
            IFS="${OLD_IFS}"
            echo "CDN upload complete."
