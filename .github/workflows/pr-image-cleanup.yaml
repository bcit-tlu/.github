# Reusable workflow: delete the GHCR image versions a pull request's
# builds published (oci-build `push_pr_images`) once the PR is closed or
# merged.
#
# What is deleted: for each image, every package version whose tags are
# ONLY `pr-<number>` and/or `sha-<sha>` tags — i.e. PR builds. Main-branch
# builds always carry a semver-rc tag as well, so they are never matched;
# release tags (`vX.Y.Z`, `latest`) likewise. A version is also only
# considered if it carries `pr-<number>` for THIS PR or a `sha-<sha>` of
# one of this PR's commits, so one PR's cleanup never touches another's.
#
# Caller example (put in .github/workflows/pr-image-cleanup.yaml):
#
#   name: PR image cleanup
#   on:
#     pull_request:
#       types: [closed]
#   jobs:
#     cleanup:
#       uses: bcit-tlu/.github/.github/workflows/pr-image-cleanup.yaml@main
#       permissions:
#         contents: read
#         packages: write
#         pull-requests: read
#       with:
#         image_names: |
#           hriv-frontend
#           hriv-backend
#
# GITHUB_TOKEN with packages: write can delete versions of packages that
# belong to the calling repository (which is where oci-build publishes).
# Fork PRs never pushed images, so there is nothing to delete for them.
#
# Known gaps (by design, not silent): a head that was force-pushed away
# leaves its sha-<old head> version behind (it is no longer a PR commit
# and the pr-<n> alias moved on); a build still running when the PR
# closes publishes after this job ran. Both are sha-only versions and are
# the target of a periodic sweep, not of this per-PR hook.

name: PR image cleanup

on:
  workflow_call:
    inputs:
      image_names:
        description: "Image names under the repository namespace, newline-separated (e.g. hriv-frontend)."
        required: true
        type: string

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Delete this PR's image versions
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE_NAMES: ${{ inputs.image_names }}
        shell: bash
        run: |
          set -euo pipefail

          # Commits of this PR → the sha-<sha> tags its builds produced.
          mapfile -t pr_shas < <(gh api --paginate "repos/${OWNER}/${REPO}/pulls/${PR_NUMBER}/commits" --jq '.[].sha')
          echo "PR #${PR_NUMBER}: ${#pr_shas[@]} commit(s)"

          is_pr_sha() { local s; for s in "${pr_shas[@]}"; do [[ "$1" == "sha-${s}" ]] && return 0; done; return 1; }

          deleted=0
          while IFS= read -r image; do
            image="$(echo "${image}" | xargs)"; [[ -z "${image}" ]] && continue
            pkg="${REPO}/${image}"
            enc="${pkg//\//%2F}"
            # Org-owned packages live under /orgs; user-owned under /users.
            base="orgs/${OWNER}/packages/container/${enc}"
            if ! gh api "${base}/versions?per_page=1" >/dev/null 2>&1; then
              base="users/${OWNER}/packages/container/${enc}"
            fi
            echo "== ${pkg}"
            # List everything first (a failed listing is fatal), decide, then
            # delete — deleting while paginating would shift offsets and skip
            # versions.
            listing="$(mktemp)"
            gh api --paginate "${base}/versions?per_page=100" \
              --jq '.[] | select(.metadata.container.tags | length > 0) | [.id, (.metadata.container.tags | join(","))] | @tsv' \
              >"${listing}"
            to_delete=()
            while IFS=$'\t' read -r id tags; do
              [[ -z "${id}" ]] && continue
              IFS=',' read -ra tag_list <<< "${tags}"
              mine=false; only_pr=true
              for t in "${tag_list[@]}"; do
                [[ "${t}" == "pr-${PR_NUMBER}" ]] && mine=true
                is_pr_sha "${t}" && mine=true
                [[ "${t}" =~ ^(pr-[0-9]+|sha-[0-9a-f]{40})$ ]] || only_pr=false
              done
              if [[ "${mine}" == true && "${only_pr}" == true ]]; then
                echo "  will delete version ${id} [${tags}]"; to_delete+=("${id}")
              elif [[ "${mine}" == true ]]; then
                echo "  keep version ${id} [${tags}] — also tagged for a non-PR build"
              fi
            done <"${listing}"
            for id in "${to_delete[@]}"; do
              gh api -X DELETE "${base}/versions/${id}" >/dev/null
              deleted=$((deleted+1))
            done
          done <<< "${IMAGE_NAMES}"
          echo "deleted ${deleted} version(s)"
