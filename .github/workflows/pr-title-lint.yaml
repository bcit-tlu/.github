# Reusable workflow: enforce Conventional Commit PR titles.
#
# Language-agnostic — works for any repo (python, node, helm, etc.)
# whose release tooling parses PR titles (e.g. release-please).
#
# Call it from a `pull_request` event — the underlying action and the
# bot-skip guard need the PR context. Do not use `pull_request_target`:
# GitHub blocks that event on public repositories by default
# (https://gh.io/securely-using-pull_request_target), and this check needs
# no write access or secrets: it only reads the PR, so the read-only token
# that same-repo and fork PRs both receive is enough.
# Failures are explained in the job summary and an error annotation rather
# than a PR comment, which would need `pull-requests: write`.
#
# Caller example:
#
#   name: pr-title-lint
#   on:
#     pull_request:
#       types: [opened, edited, reopened, synchronize]
#       branches: [main]
#   permissions:
#     contents: read
#     pull-requests: read
#   jobs:
#     lint:
#       uses: bcit-tlu/.github/.github/workflows/pr-title-lint.yaml@main
#       permissions:
#         contents: read
#         pull-requests: read

name: PR title lint

on:
  workflow_call:
    inputs:
      types:
        description: "Newline-separated Conventional Commit types to allow."
        required: false
        type: string
        default: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
          revert
      require_scope:
        description: "Require a scope in the PR title (e.g. feat(api): ...)."
        required: false
        type: boolean
        default: false
      subject_pattern:
        description: "Regex the subject must match."
        required: false
        type: string
        default: "^(?![A-Z]).+$"
      subject_pattern_error:
        description: "Message shown when the subject fails subject_pattern."
        required: false
        type: string
        default: |
          The subject "{subject}" in PR title "{title}" must start with a
          lowercase letter (imperative mood, no trailing period). See
          CONTRIBUTING.md for examples.

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.type != 'Bot'
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Validate the PR title against the allowed Conventional Commit types
      # and subject pattern. Fails the job on a non-conforming title.
      - id: lint
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}
          requireScope: ${{ inputs.require_scope }}
          subjectPattern: ${{ inputs.subject_pattern }}
          subjectPatternError: ${{ inputs.subject_pattern_error }}

      # On failure, explain the required format in the job summary (linked
      # from the failed check). The action itself reports the specific
      # reason as an error annotation; it exposes no output to reuse here.
      - name: Explain failure
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          {
            cat <<'MD'
          ## PR title must follow Conventional Commits

          release-please uses PR titles on `main` to determine version bumps and changelog entries.

          The specific reason is shown in this check's annotations (set by `action-semantic-pull-request`).

          ```
          <type>[optional scope][!]: <subject>
          ```

          - `type`: `feat`, `fix`, `docs`, `style`, `refactor`, `perf`, `test`, `build`, `ci`, `chore`, `revert`
          - `subject`: start lowercase, imperative mood, no trailing period
          - breaking change: add `!` (or `BREAKING CHANGE:` in body)

          Examples:
          - ✅ `feat: add search page`
          - ✅ `fix: correct broken nav link`
          - ❌ `Add search page`
          - ❌ `feat: Add search page`

          Edit the PR title in GitHub; this check reruns automatically.
          MD
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=PR title must follow Conventional Commits::Edit the PR title to match <type>[optional scope][!]: <subject>. See this run's summary for the format and examples."
