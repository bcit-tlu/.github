name: "CDN stable history"
description: |
  Maintain a rolling list of the last N stable CDN SHAs in blob storage. The
  list is used by cleanup jobs to know which historical stable SHAs must not
  be deleted.

inputs:
  cdn_account_name:
    description: "Azure Storage account name."
    required: true
  cdn_container:
    description: "Azure Blob container name. Defaults to repo_name (one container per repo)."
    required: false
    default: ""
  cdn_sas_token:
    description: "Azure Blob Storage SAS token. Leave empty when the job uses azure/login (OIDC) — the script falls back to --auth-mode login."
    required: false
    default: ""
  repo_name:
    description: "Repository / application name segment in the CDN path."
    required: true
  stable_sha:
    description: "Stable release SHA to add to the history."
    required: true
  keep_stable:
    description: "Number of stable SHAs to keep. Minimum 5."
    required: false
    default: "5"

runs:
  using: composite
  steps:
    - run: bash "${{ github.action_path }}/cdn-stable-history.sh"
      shell: bash
      env:
        CDN_ACCOUNT_NAME: ${{ inputs.cdn_account_name }}
        CDN_CONTAINER: ${{ inputs.cdn_container || inputs.repo_name }}
        CDN_SAS_TOKEN: ${{ inputs.cdn_sas_token }}
        STABLE_SHA: ${{ inputs.stable_sha }}
        KEEP_STABLE: ${{ inputs.keep_stable }}
