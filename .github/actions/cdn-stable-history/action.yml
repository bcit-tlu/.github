name: "CDN stable history"
description: |
  Maintain a rolling list of the last N stable CDN SHAs in blob storage. The
  list is used by cleanup jobs to know which historical stable SHAs must not
  be deleted.

inputs:
  cdn_account_name:
    description: "Azure Storage account name."
    required: true
  cdn_container:
    description: "Azure Blob container name."
    required: true
  cdn_sas_token:
    description: "Azure Blob Storage SAS token."
    required: true
  cdn_namespace:
    description: "Optional path namespace. Use 'none' or leave empty for no namespace."
    required: false
    default: ""
  repo_name:
    description: "Repository / application name segment in the CDN path."
    required: true
  stable_sha:
    description: "Stable release SHA to add to the history."
    required: true
  keep_stable:
    description: "Number of stable SHAs to keep."
    required: false
    default: "5"

runs:
  using: composite
  steps:
    - run: bash "${{ github.action_path }}/cdn-stable-history.sh"
      shell: bash
      env:
        CDN_ACCOUNT_NAME: ${{ inputs.cdn_account_name }}
        CDN_CONTAINER: ${{ inputs.cdn_container }}
        CDN_SAS_TOKEN: ${{ inputs.cdn_sas_token }}
        CDN_NAMESPACE: ${{ inputs.cdn_namespace }}
        REPO_NAME: ${{ inputs.repo_name }}
        STABLE_SHA: ${{ inputs.stable_sha }}
        KEEP_STABLE: ${{ inputs.keep_stable }}
