name: "CDN resolve prefix"
description: "Resolve the CDN path convention shared by cdn-upload and cdn-promote. Single source of truth for the layout: one container per repo, blobs at <ref>/ inside it, public URLs at /<repo>/<ref>/ — where <ref> is the content-addressed build hash (hex)."

inputs:
  repo_name:
    description: "Repository / application name segment in the CDN path."
    required: true
  content_ref:
    description: "Content ref (dist content hash) used as the immutable asset folder."
    required: false
    default: ""
  cdn_base_url:
    description: "CDN origin URL including the container path (e.g. https://<name>.azurefd.net/<container>). Required only for the cdn_url output."
    required: false
    default: ""

outputs:
  destination_prefix:
    description: "Blob prefix this run's assets live under (<ref>)."
    value: ${{ steps.resolve.outputs.destination_prefix }}
  cdn_url:
    description: "Full public CDN URL for this run's assets (cdn_base_url/<repo>/<ref>). Empty when no ref or cdn_base_url was provided."
    value: ${{ steps.resolve.outputs.cdn_url }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        REPO_NAME: ${{ inputs.repo_name }}
        CONTENT_REF: ${{ inputs.content_ref }}
        CDN_BASE_URL: ${{ inputs.cdn_base_url }}
      run: |
        set -euo pipefail

        if [ -n "${CDN_BASE_URL}" ] && [[ ! "${CDN_BASE_URL}" =~ ^https?:// ]]; then
          echo "ERROR: cdn_base_url must include the scheme (got '${CDN_BASE_URL}'); schemeless values rewrite assets to relative URLs which browsers resolve against the CDN path, corrupting them" >&2
          exit 1
        fi

        # Convention: one container per repo; blobs live directly under <ref>/ inside it.
        # Front Door maps the public /<repo>/<ref>/ path to the container (catch-all pass-through for the communal account, or a per-repo route origin path for dedicated accounts).

        destination_prefix=""
        cdn_url=""
        if [ -n "${CONTENT_REF}" ]; then
          destination_prefix="${CONTENT_REF}"
          url_prefix="${REPO_NAME}/${CONTENT_REF}"
          if [ -n "${CDN_BASE_URL}" ]; then
            cdn_url="${CDN_BASE_URL%/}/${url_prefix}"
          fi
        fi

        echo "destination_prefix=${destination_prefix}" >> "$GITHUB_OUTPUT"
        echo "cdn_url=${cdn_url}" >> "$GITHUB_OUTPUT"
