name: "CDN cleanup old SHA prefixes"
description: |
  Delete unreferenced CDN SHA prefixes from Azure Blob Storage. A SHA is
  protected if it appears in .latest-current, .latest-history, .stable-current,
  .stable-history, or is the current run SHA.

inputs:
  cdn_account_name:
    description: "Azure Storage account name."
    required: true
  cdn_container:
    description: "Azure Blob container name. Defaults to repo_name (one container per repo)."
    required: false
    default: ""
  cdn_sas_token:
    description: "Azure Blob Storage SAS token."
    required: true
  repo_name:
    description: "Repository / application name segment in the CDN path."
    required: true
  latest_sha:
    description: "Current latest SHA; written to .latest-current and .latest-history."
    required: true
  keep_stable:
    description: "Number of stable release SHAs protected via the .stable-history journal. Minimum 5."
    required: false
    default: "5"
  keep_recent:
    description: "Number of latest SHAs kept in the .latest-history journal (rollout-lag + rollback window). Minimum 5."
    required: false
    default: "5"

runs:
  using: composite
  steps:
    - run: bash "${{ github.action_path }}/cdn-cleanup.sh"
      shell: bash
      env:
        CDN_ACCOUNT_NAME: ${{ inputs.cdn_account_name }}
        CDN_CONTAINER: ${{ inputs.cdn_container || inputs.repo_name }}
        CDN_SAS_TOKEN: ${{ inputs.cdn_sas_token }}
        LATEST_SHA: ${{ inputs.latest_sha }}
        KEEP_STABLE: ${{ inputs.keep_stable }}
        KEEP_RECENT: ${{ inputs.keep_recent }}
