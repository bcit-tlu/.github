name: "CDN cleanup old ref prefixes"
description: "Delete unreferenced CDN ref prefixes from Azure Blob Storage. A ref (content hash) is protected if it appears in .latest-current, .latest-history, .stable-current, .stable-history, or is the current run's ref; dot-prefixed bookkeeping blobs (.by-commit/*, pointers, journals) are never touched. With per-channel storage accounts the caller picks the account via cdn_account_name and passes channel: 'latest' also writes the .latest-* pointers; 'stable' only reads pointers (cdn-stable-history owns stable pointer writes). Empty channel preserves the legacy single-container mode."

inputs:
  cdn_account_name:
    description: "Azure Storage account name."
    required: true
  cdn_container:
    description: "Azure Blob container name. Defaults to repo_name (one container per repo)."
    required: false
    default: ""
  channel:
    description: "CDN channel (latest or stable). Controls which pointer blobs are written."
    required: false
    default: ""
  cdn_sas_token:
    description: "Azure Blob Storage SAS token. Leave empty when the job uses azure/login (OIDC) — the script falls back to --auth-mode login."
    required: false
    default: ""
  repo_name:
    description: "Repository / application name segment in the CDN path."
    required: true
  ref:
    description: "Content ref this channel is now serving; always protected from deletion."
    required: true
  keep_stable:
    description: "Number of stable release refs protected via the .stable-history journal. Minimum 5."
    required: false
    default: "5"
  immutable_days:
    description: "Account-level immutability window in days (set to the storage account's immutability_policy_days — 90 for the stable CDN account). Refs whose youngest blob is inside the window are skipped instead of failing delete."
    required: false
    default: ""
  keep_recent:
    description: "Number of latest refs kept in the .latest-history journal (rollout-lag + rollback window). Minimum 5."
    required: false
    default: "5"

runs:
  using: composite
  steps:
    - run: bash "${{ github.action_path }}/cdn-cleanup.sh"
      shell: bash
      env:
        CDN_ACCOUNT_NAME: ${{ inputs.cdn_account_name }}
        CDN_CONTAINER: ${{ inputs.cdn_container || inputs.repo_name }}
        CHANNEL: ${{ inputs.channel }}
        CDN_SAS_TOKEN: ${{ inputs.cdn_sas_token }}
        SERVE_REF: ${{ inputs.ref }}
        IMMUTABLE_DAYS: ${{ inputs.immutable_days }}
        KEEP_STABLE: ${{ inputs.keep_stable }}
        KEEP_RECENT: ${{ inputs.keep_recent }}
